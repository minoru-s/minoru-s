<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="92" viewBox="0 0 1100 92" role="img" aria-labelledby="title desc">
  <title id="title">Recent activity</title><desc id="desc">A translucent Finder-like section bar for recently updated public repositories.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff" stop-opacity=".94"/><stop offset=".5" stop-color="#eef2ff" stop-opacity=".84"/><stop offset="1" stop-color="#fff4fb" stop-opacity=".82"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#41d8ff"/><stop offset=".52" stop-color="#8175ff"/><stop offset="1" stop-color="#ff78b8"/></linearGradient>
    <filter id="blur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>.panel{fill:url(#glass);stroke:#c9d6eb;stroke-opacity:.76}.title{fill:#172033}.sub{fill:#6a758a}.live{fill:#4b5870}@media(prefers-color-scheme:dark){.panel{fill:#111a2a;stroke:#ffffff;stroke-opacity:.18}.title{fill:#f4f7ff}.sub,.live{fill:#aeb9cf}}</style>
  </defs>
  <g opacity=".36" filter="url(#blur)"><ellipse cx="165" cy="48" rx="130" ry="30" fill="#45d7ff"/><ellipse cx="925" cy="48" rx="150" ry="30" fill="#ff77b6"/></g>
  <rect class="panel" x="8" y="12" width="1084" height="68" rx="22"/>
  <rect x="8" y="12" width="1084" height="3" rx="1.5" fill="url(#line)" opacity=".72"/>
  <circle cx="39" cy="46" r="6" fill="#ff6b68"/><circle cx="59" cy="46" r="6" fill="#ffc04b"/><circle cx="79" cy="46" r="6" fill="#37c85a"/>
  <text x="112" y="43" class="title" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" letter-spacing=".8">RECENT ACTIVITY</text>
  <text x="112" y="61" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" letter-spacing="1.2">PUBLIC REPOSITORIES · MOST RECENT FIRST</text>
  <circle cx="945" cy="46" r="4" fill="#34c759"/><text x="958" y="50" class="live" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">SYNCED DAILY</text>
</svg>
