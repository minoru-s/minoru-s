  <text x="92" y="45" class="title" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" letter-spacing=".8">APPLICATIONS</text>
  <text x="92" y="64" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" letter-spacing="1.15">BROWSER-NATIVE TOOLS · CLICK AN ICON TO LAUNCH</text>
  <text x="965" y="55" class="hint" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1">APP SHELF</text>
