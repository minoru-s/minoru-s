<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="102" viewBox="0 0 1100 102" role="img" aria-labelledby="title desc">
  <title id="title">Applications</title><desc id="desc">A slim liquid-glass section title introducing browser applications.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3fbff" stop-opacity=".9"/><stop offset=".5" stop-color="#f0efff" stop-opacity=".84"/><stop offset="1" stop-color="#fff3fa" stop-opacity=".88"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43d7ff"/><stop offset=".5" stop-color="#7b75ff"/><stop offset="1" stop-color="#ff78b7"/></linearGradient>
    <style>.panel{fill:url(#glass);stroke:#c9d6eb;stroke-opacity:.72}.title{fill:#172033}.sub{fill:#657188}.hint{fill:#5b6780}@media(prefers-color-scheme:dark){.panel{fill:#111a2a;stroke:#fff;stroke-opacity:.18}.title{fill:#f5f7ff}.sub,.hint{fill:#aeb9cf}}</style>
  </defs>
  <rect class="panel" x="8" y="15" width="1084" height="72" rx="25"/>
  <path d="M33 76C230 63 354 86 537 70S823 51 1067 67" fill="none" stroke="url(#spectrum)" stroke-width="2" opacity=".46"/>
