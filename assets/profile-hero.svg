<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Abstract liquid-glass header</title>
  <desc id="desc">A decorative field of softly refracted cyan, violet, and pink light with flowing signal lines.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset=".46" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#fff5fb"/>
    </linearGradient>
    <radialGradient id="cyan"><stop stop-color="#4bd8ff" stop-opacity=".78"/><stop offset="1" stop-color="#4bd8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#8778ff" stop-opacity=".7"/><stop offset="1" stop-color="#8778ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#ff79b8" stop-opacity=".56"/><stop offset="1" stop-color="#ff79b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42d8ff"/><stop offset=".52" stop-color="#7b76ff"/><stop offset="1" stop-color="#ff78b8"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".58"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/></linearGradient>
    <filter id="blur" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="ribbonShadow" x="-20%" y="-80%" width="140%" height="260%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#455b8a" flood-opacity=".12"/></filter>
    <clipPath id="clip"><rect x="8" y="8" width="1184" height="234" rx="34"/></clipPath>
    <style>
      .canvas{fill:url(#canvas)}.rim{stroke:#cbd7eb;stroke-opacity:.68}.signal{animation:signal 7s ease-in-out infinite}.driftA{animation:driftA 9s ease-in-out infinite}.driftB{animation:driftB 11s ease-in-out infinite}
      @media(prefers-color-scheme:dark){.canvas{fill:#0c1221}.rim{stroke:#fff;stroke-opacity:.16}.ribbon{opacity:.42}.fine{stroke-opacity:.38}}
      @media(prefers-reduced-motion:reduce){.signal,.driftA,.driftB{animation:none}}
      @keyframes signal{0%,100%{opacity:.35;transform:translateX(-8px)}50%{opacity:.9;transform:translateX(8px)}}
      @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-7px)}}
      @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,9px)}}
    </style>
  </defs>
  <rect class="canvas" x="8" y="8" width="1184" height="234" rx="34"/>
  <g clip-path="url(#clip)">
    <ellipse class="driftA" cx="105" cy="30" rx="250" ry="165" fill="url(#cyan)" filter="url(#blur)"/>
    <ellipse class="driftB" cx="1040" cy="24" rx="280" ry="170" fill="url(#violet)" filter="url(#blur)"/>
    <ellipse class="driftA" cx="770" cy="255" rx="290" ry="135" fill="url(#pink)" filter="url(#blur)"/>
    <path class="ribbon" d="M-80 137C118 52 275 222 480 134S803 47 1285 150L1285 208C823 115 684 207 495 190S146 111-80 201Z" fill="url(#ribbon)" stroke="#fff" stroke-opacity=".66" filter="url(#ribbonShadow)"/>
    <path class="fine" d="M-55 162C134 76 278 229 482 145S817 71 1265 166" fill="none" stroke="url(#spectrum)" stroke-width="2.2" stroke-opacity=".56"/>
    <path class="signal" d="M-55 170C134 84 278 237 482 153S817 79 1265 174" fill="none" stroke="#fff" stroke-width="1" stroke-opacity=".9"/>
    <path d="M25 72C214 128 308 34 485 88S791 174 1180 76" fill="none" stroke="#fff" stroke-width="1" stroke-opacity=".38"/>
    <g fill="#fff">
      <circle cx="168" cy="104" r="3" opacity=".78"/><circle cx="412" cy="116" r="2" opacity=".55"/><circle cx="738" cy="129" r="3" opacity=".7"/><circle cx="1014" cy="101" r="2" opacity=".58"/>
    </g>
  </g>
  <rect class="rim" x="8.7" y="8.7" width="1182.6" height="232.6" rx="33.3" fill="none"/>
</svg>
