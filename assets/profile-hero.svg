<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Saito Minoru — haptics, spatial computing, and research tools</title>
  <desc id="desc">A subtle liquid-glass instrument panel showing Minoru Saito's research and building focus.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="0.48" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f9f5ff"/>
    </linearGradient>
    <radialGradient id="auraA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55d7ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#55d7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff88bf" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ff88bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".44" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e9f2ff" stop-opacity=".27"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset=".36" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".7" stop-color="#8ecbff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35c8ff"/>
      <stop offset=".5" stop-color="#7773ff"/>
      <stop offset="1" stop-color="#ff72b5"/>
    </linearGradient>
    <filter id="blur36" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#38527c" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#44618d" flood-opacity=".14"/>
    </filter>
    <filter id="orb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="8" specularConstant="1.1" specularExponent="24" lighting-color="#fff" result="spec">
        <fePointLight x="-25" y="-35" z="90"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="1" k2="1" k3="1" k4="0"/>
    </filter>
    <clipPath id="frameClip"><rect x="12" y="12" width="1176" height="366" rx="42"/></clipPath>
    <style>
      .ink{fill:#172033}.muted{fill:#5d687d}.hair{stroke:#5d687d;stroke-opacity:.25}.glass{fill:url(#glass);stroke:url(#edge);stroke-width:1.4}.micro{font:600 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2.4px}.label{font:600 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px}.body{font:500 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hero{font:650 48px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-1.8px}.display{font:650 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.4px}
      @media (prefers-color-scheme:dark){.canvas{fill:#0b1020}.ink{fill:#f6f8ff}.muted{fill:#aab5cb}.hair{stroke:#dce6ff;stroke-opacity:.18}.glass{fill:url(#glassDark);stroke:url(#edge);stroke-opacity:.58}.baseStroke{stroke:#fff;stroke-opacity:.15}.shadowed{filter:url(#softShadow)}}
      @media (prefers-reduced-motion:no-preference){.floatA{animation:floatA 7s ease-in-out infinite}.floatB{animation:floatB 8.5s ease-in-out infinite}.pulse{animation:pulse 4.8s ease-in-out infinite}@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-8px)}}@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-7px,7px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}}
    </style>
  </defs>

  <rect class="canvas" x="12" y="12" width="1176" height="366" rx="42" fill="url(#canvas)"/>
  <g clip-path="url(#frameClip)">
    <ellipse cx="180" cy="66" rx="210" ry="145" fill="url(#auraA)" filter="url(#blur36)"/>
    <ellipse cx="1000" cy="72" rx="245" ry="165" fill="url(#auraB)" filter="url(#blur36)"/>
    <ellipse cx="760" cy="388" rx="260" ry="150" fill="url(#auraC)" filter="url(#blur36)"/>
    <path d="M-20 300C170 220 250 390 448 302S760 215 1225 326" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".34"/>
    <path class="pulse" d="M-20 300C170 220 250 390 448 302S760 215 1225 326" fill="none" stroke="#fff" stroke-width="1" stroke-opacity=".72"/>
  </g>
  <rect class="baseStroke" x="12.7" y="12.7" width="1174.6" height="364.6" rx="41.3" fill="none" stroke="#c8d6ee"/>

  <g class="shadowed" filter="url(#shadow)">
    <rect class="glass" x="42" y="42" width="720" height="250" rx="34"/>
  </g>
  <path d="M76 75h178" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".74"/>
  <circle cx="92" cy="92" r="7" fill="#56d5ff"/>
  <text x="111" y="97" class="micro muted">LIVE LAB / 2026</text>
  <text x="80" y="168" class="hero ink">Saito Minoru</text>
  <text x="82" y="204" class="body muted">Haptics · spatial computing · research tools</text>
  <g transform="translate(80 231)">
    <rect width="158" height="38" rx="19" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".72"/>
    <circle cx="20" cy="19" r="5" fill="#22c98b"/>
    <text x="35" y="24" class="label ink">TOKYO / ACTIVE</text>
  </g>
  <g transform="translate(255 231)">
    <rect width="212" height="38" rx="19" fill="#fff" fill-opacity=".34" stroke="#fff" stroke-opacity=".58"/>
    <text x="20" y="24" class="label ink">SENSE → MODEL → SHIP</text>
  </g>

  <g class="floatA shadowed" filter="url(#softShadow)">
    <rect class="glass" x="790" y="48" width="360" height="124" rx="31"/>
    <text x="821" y="83" class="micro muted">01 / RESEARCH</text>
    <text x="821" y="124" class="display ink">Haptics × XR</text>
    <path d="M1021 112c15-35 33 35 48 0s33 35 48 0" fill="none" stroke="url(#spectrum)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="floatB shadowed" filter="url(#softShadow)">
    <rect class="glass" x="820" y="194" width="330" height="124" rx="31"/>
    <text x="851" y="229" class="micro muted">02 / BUILDING</text>
    <text x="851" y="270" class="display ink">Physical data → tools</text>
    <circle cx="1110" cy="228" r="18" fill="url(#spectrum)" fill-opacity=".68" filter="url(#orb)"/>
  </g>

  <g class="floatA" filter="url(#orb)">
    <circle cx="772" cy="318" r="24" fill="#fff" fill-opacity=".28" stroke="#fff" stroke-opacity=".76"/>
    <circle cx="765" cy="310" r="7" fill="#fff" fill-opacity=".82"/>
  </g>
  <text x="45" y="348" class="micro muted">PUBLIC WORKBENCH</text>
  <line x1="212" y1="344" x2="660" y2="344" class="hair"/>
  <text x="678" y="348" class="micro muted">SIGNAL ONLINE</text>
</svg>
