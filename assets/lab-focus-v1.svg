<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="218" viewBox="0 0 1100 218" role="img" aria-labelledby="title desc">
  <title id="title">Research focus</title><desc id="desc">Three connected glass panels for haptics, spatial computing, and robotics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3fbff"/><stop offset=".5" stop-color="#f0efff"/><stop offset="1" stop-color="#fff4fa"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3bd8ff"/><stop offset=".5" stop-color="#7c73ff"/><stop offset="1" stop-color="#ff79b5"/></linearGradient><style>.panel{fill:url(#bg);stroke:#cfdaeb}.title{fill:#172033}.sub{fill:#68748a}.cap{fill:#56627a}@media(prefers-color-scheme:dark){.panel{fill:#111a2a;stroke:#fff;stroke-opacity:.18}.title{fill:#f5f7ff}.sub,.cap{fill:#aeb9cf}}</style></defs>
  <text x="550" y="24" class="cap" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">IN THE LAB · CURRENT RESEARCH LENSES</text>
  <path d="M270 112H830" stroke="url(#line)" stroke-width="2" opacity=".5"/>
  <g transform="translate(38 46)"><rect class="panel" width="310" height="142" rx="28"/><circle cx="52" cy="51" r="25" fill="#43d4ff" opacity=".9"/><path d="M41 51c8-16 15 16 23 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><text x="91" y="47" class="title" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">Haptics / VR / AR</text><text x="91" y="67" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">PHYSICAL INTERACTION</text><text x="28" y="105" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Human–computer interaction through</text><text x="28" y="123" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">touch, space, and perception.</text></g>
  <g transform="translate(395 46)"><rect class="panel" width="310" height="142" rx="28"/><circle cx="52" cy="51" r="25" fill="#7c73ff" opacity=".9"/><path d="M41 58l11-18 11 18H41Zm11-18v18" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><text x="91" y="47" class="title" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">Spatial computing</text><text x="91" y="67" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">3D DATA &amp; INTERFACES</text><text x="28" y="105" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Small experiments around Gaussian</text><text x="28" y="123" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">splatting and spatial interfaces.</text></g>
  <g transform="translate(752 46)"><rect class="panel" width="310" height="142" rx="28"/><circle cx="52" cy="51" r="25" fill="#ff79b5" opacity=".9"/><path d="M40 56h24M44 56v-12h16v12m-12-12v-8m8 8v-8M45 62h2m16 0h2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="91" y="47" class="title" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">Robotics</text><text x="91" y="67" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">LUNAR EXPLORATION</text><text x="28" y="105" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Prototyping, simulation, field tests,</text><text x="28" y="123" class="sub" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">and motion-capture analysis.</text></g>
</svg>
